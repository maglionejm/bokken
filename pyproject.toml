[project]
name = "bokken"
version = "0.1.0"
description = "An agentic harness for Design Thinking - one executable, instrumented loop. Test with wood; commit steel when it counts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Juan Martin Maglione" }]
keywords = ["design-thinking", "agents", "facilitation", "llm", "mcp"]
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.8",
    "typer>=0.15",
    "rich>=13.9",
    "mcp>=1.5",
]

[project.scripts]
bokken = "bokken.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bokken"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
