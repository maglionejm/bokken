[project]
name = "bokken"
version = "1.0.0"
description = "An agentic harness for Design Thinking - one executable, instrumented loop. Test with wood; commit steel when it counts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Juan Martin Maglione" }]
keywords = ["design-thinking", "agents", "facilitation", "llm", "mcp", "product-discovery", "jtbd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.8",
    "typer>=0.15",
    "rich>=13.9",
    "mcp>=1.5",
    "python-pptx>=1.0.2",
]

[project.urls]
Homepage = "https://maglionejm.github.io/bokken/"
Repository = "https://github.com/maglionejm/bokken"
Changelog = "https://github.com/maglionejm/bokken/releases"
Issues = "https://github.com/maglionejm/bokken/issues"

[project.scripts]
bokken = "bokken.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bokken"]

[project.optional-dependencies]
ui = ["playwright>=1.49", "beautifulsoup4>=4.12"]
interview = ["twilio>=9.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Presentation templates: PPTX/HTML markup strings do not wrap at 100 chars.
"src/bokken/report/deck.py" = ["E501"]
"src/bokken/report/page.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
